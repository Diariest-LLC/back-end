version: '3.8'

services:
  redis:
    container_name: diariest_redis
    image: 'redis:latest'
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL,CONFIG
    ports:
      - '6379:6379'

  postgresql:
    container_name: diariest_psql
    image: 'postgres:latest'
    environment:
      - POSTGRES_USER=diariest
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=diariest
    ports:
      - '5438:5432'

  cassandra:
    container_name: diariest_cassandra
    image: bitnami/cassandra:latest
    volumes:
      - cassandra_data:/bitnami
    ports:
      - '9042:9042'
      - '7199:7199'
      - '7000:7000'
      - '7001:7001'
      - '9160:9160'
    environment:
      - CASSANDRA_CLUSTER_NAME=diariest

volumes:
  cassandra_data:
    driver: local